<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jornal Cienc.IA</title>
  <meta name="description" content="Jornal de ciência em saúde com linguagem acessível, fonte rastreável e revisão humana." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root{
      --navy:#0b1630;
      --navy-2:#12244a;
      --ink:#152033;
      --muted:#667085;
      --paper:#f4f6f9;
      --white:#fff;
      --line:#dfe5ec;
      --blue:#245eea;
      --blue-soft:#edf3ff;
      --teal:#0f8f7b;
      --teal-soft:#eafaf6;
      --amber:#a15c05;
      --amber-soft:#fff7e8;
      --green:#19724b;
      --shadow:0 16px 44px rgba(15,23,42,.10);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    h1,h2,h3{font-family:Newsreader,Georgia,serif;line-height:1.12}

    .site-header{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;box-shadow:0 5px 20px rgba(11,22,48,.22)}
    .masthead{max-width:1180px;margin:auto;padding:17px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:13px}
    .brand-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--blue),var(--teal));display:grid;place-items:center;font-size:1.15rem;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
    .brand-kicker{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;color:#aebbd1;font-weight:800}
    .brand-name{font-family:Newsreader,Georgia,serif;font-size:1.62rem;font-weight:700;line-height:1}
    .brand-name .ia{color:#7eb0ff}
    .brand-tagline{font-size:.75rem;color:#bac5d7;margin-top:3px}
    .today{font-size:.78rem;color:#cbd5e1;text-align:right}

    .toolbar{border-top:1px solid rgba(255,255,255,.09);background:#101f3e}
    .toolbar-inner{max-width:1180px;margin:auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .topics{display:flex;gap:8px;overflow:auto;scrollbar-width:none}
    .topic{white-space:nowrap;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:transparent;color:#e7ebf1;padding:7px 14px;font-size:.78rem;font-weight:700}
    .topic:hover,.topic.active{background:var(--blue);border-color:var(--blue);color:#fff}
    .search{position:relative;min-width:290px}
    .search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#aab5c7}
    .search input{width:100%;border:1px solid rgba(255,255,255,.17);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;padding:9px 15px 9px 38px;outline:none}
    .search input::placeholder{color:#aab5c7}

    main{max-width:1180px;margin:auto;padding:38px 24px 80px}
    .intro{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(260px,.65fr);gap:22px;margin-bottom:42px}
    .featured{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:38px;box-shadow:var(--shadow);transition:.2s;cursor:pointer;position:relative;overflow:hidden}
    .featured::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(var(--blue),var(--teal))}
    .featured:hover,.news-card:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(15,23,42,.14)}
    .eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--blue-soft);color:#1946ad;border-radius:999px;padding:5px 11px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
    .featured h1{font-size:2.48rem;margin:16px 0 12px}
    .featured .subtitle{font-size:1.02rem;color:#344054;font-weight:650}
    .featured .preview{color:var(--muted);max-width:790px}
    .meta{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:.78rem;margin-top:19px}

    .reading-guide{background:var(--navy);color:#fff;border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
    .reading-guide h2{font-size:1.48rem;margin:0 0 9px}
    .reading-guide>p{color:#c6d0df;font-size:.88rem}
    .guide-item{display:flex;gap:11px;margin-top:17px;align-items:flex-start}
    .guide-number{width:29px;height:29px;flex:0 0 29px;border-radius:9px;background:rgba(255,255,255,.10);display:grid;place-items:center;font-weight:800}
    .guide-item strong{display:block;font-size:.88rem}
    .guide-item small{display:block;color:#b9c4d3;margin-top:2px;line-height:1.4}

    .section-head{display:flex;align-items:end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:22px}
    .section-head h2{font-size:1.58rem;margin:0}
    .section-head span{font-size:.8rem;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
    .news-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:23px;box-shadow:0 8px 22px rgba(15,23,42,.06);transition:.2s;cursor:pointer;display:flex;flex-direction:column;min-height:305px}
    .chips{display:flex;flex-wrap:wrap;gap:7px}
    .chip{border-radius:999px;padding:4px 9px;background:#eef1f5;color:#475467;font-size:.66rem;font-weight:800;text-transform:uppercase}
    .chip.blue{background:var(--blue-soft);color:#1844a8}
    .chip.green{background:#e9f8f0;color:var(--green)}
    .news-card h3{font-size:1.31rem;margin:13px 0 10px}
    .news-card p{color:var(--muted);font-size:.89rem;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
    .news-card-footer{margin-top:auto;border-top:1px solid var(--line);padding-top:13px;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.72rem}
    .empty{text-align:center;padding:90px 20px;color:var(--muted)}

    .reader-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(8,18,39,.68);padding:22px;overflow:auto}
    .reader-overlay.open{display:block}
    .reader-dialog{width:min(1030px,100%);margin:0 auto;background:#fff;border-radius:22px;box-shadow:0 30px 90px rgba(5,13,31,.38);overflow:hidden}
    .reader-topbar{position:sticky;top:0;z-index:8;background:#fff;border-bottom:1px solid var(--line);padding:11px 18px;display:flex;justify-content:space-between;align-items:center}
    .reader-brand{font-weight:800;color:var(--navy);font-size:.82rem;letter-spacing:.03em}
    .close-btn{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:9px 15px;font-weight:750}
    .close-btn:hover{background:#f4f6f9}
    .article-header{padding:31px 38px 28px;background:linear-gradient(135deg,#f8fbff,#fff);border-bottom:1px solid var(--line)}
    .article-header h1{font-size:2.35rem;margin:14px 0 9px}
    .article-header .subtitle{color:#475467;font-size:1rem;max-width:820px}
    .article-body{padding:0 38px 45px}
    .tabs{position:sticky;top:57px;z-index:6;background:#fff;display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);padding-top:10px}
    .tab{border:0;border-bottom:3px solid transparent;background:transparent;color:#667085;padding:14px 16px;font-weight:750;white-space:nowrap}
    .tab.active{color:var(--blue);border-bottom-color:var(--blue)}
    .panel{display:none}
    .panel.active{display:block}
    .reading-shell{max-width:790px;margin:28px auto 0}
    .reading{background:#fff;border:1px solid var(--line);border-radius:16px;padding:31px 35px;font-size:1.06rem;line-height:1.82;box-shadow:0 8px 24px rgba(15,23,42,.05)}
    .reading.n1{border-left:6px solid var(--blue)}
    .reading.source{background:#fafbfc;font-size:.98rem}
    .reading p{margin:0 0 1.08em}
    .reading p:last-child{margin-bottom:0}
    .format-note{display:flex;align-items:flex-start;gap:10px;background:var(--amber-soft);color:#70430a;border:1px solid #f2d39d;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.83rem}

    .easy-list{display:grid;gap:14px}
    .easy-block{background:#fff;border:1px solid #cfe9e3;border-left:6px solid var(--teal);border-radius:15px;padding:21px 24px;box-shadow:0 7px 20px rgba(15,143,123,.06)}
    .easy-heading{display:flex;align-items:center;gap:10px;margin-bottom:9px}
    .easy-number{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:#0b6e60;display:grid;place-items:center;font-weight:800;font-size:.8rem}
    .easy-heading h3{font-family:Inter,sans-serif;font-size:1rem;margin:0;color:#17443d}
    .easy-block p{font-size:1.06rem;line-height:1.78;margin:0;color:#20332f;white-space:pre-wrap}
    .easy-empty{padding:25px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}

    .audio{display:block;margin:14px auto 0;border:0;border-radius:999px;background:var(--navy);color:#fff;padding:10px 18px;font-weight:750}
    .audio.playing{background:#b42318}
    .publication-info{max-width:790px;margin:30px auto 0;border-top:1px solid var(--line);padding-top:24px}
    .publication-info h2{font-size:1.38rem}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
    .metric{border:1px solid var(--line);border-radius:12px;background:#fafbfc;padding:14px}
    .metric strong{display:block;font-size:1.08rem}
    .metric span{color:var(--muted);font-size:.68rem;text-transform:uppercase;font-weight:750}
    details{max-width:790px;margin:20px auto 0;border:1px solid var(--line);border-radius:12px;padding:14px 17px;background:#fff}
    summary{font-weight:750;cursor:pointer}
    .notice{color:var(--muted);font-size:.81rem}
    .source-links{max-width:790px;margin:22px auto 0;display:flex;flex-wrap:wrap;gap:10px}
    .source-links a{text-decoration:none;border-radius:9px;padding:10px 15px;font-weight:750;background:var(--navy);color:#fff}
    .source-links a.green{background:var(--green)}

    @media(max-width:820px){
      .masthead,.toolbar-inner{align-items:flex-start;flex-direction:column}
      .today{text-align:left}
      .search{width:100%;min-width:100%}
      .intro{grid-template-columns:1fr}
      .featured{padding:28px}
      .featured h1,.article-header h1{font-size:1.83rem}
      .reader-overlay{padding:0}
      .reader-dialog{min-height:100vh;border-radius:0}
      .article-header,.article-body{padding-left:20px;padding-right:20px}
      .reading{padding:23px 21px}
      .tabs{top:55px}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="masthead">
      <div class="brand">
        <div class="brand-mark"><i class="fa-solid fa-microscope"></i></div>
        <div>
          <div class="brand-kicker">Jornal de ciência e saúde</div>
          <div class="brand-name">Jornal Cienc.<span class="ia">IA</span></div>
          <div class="brand-tagline">Ciência em saúde, clara e fiel à evidência</div>
        </div>
      </div>
      <div class="today" id="today"></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-inner">
        <div class="topics" id="topics"><button class="topic active" data-topic="">Todos os temas</button></div>
        <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Buscar matéria, tema ou autor" /></label>
      </div>
    </div>
  </header>

  <main id="main"><div class="empty"><h2>Carregando publicações…</h2></div></main>

  <div class="reader-overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="articleTitle">
    <div class="reader-dialog">
      <div class="reader-topbar">
        <span class="reader-brand">Jornal Cienc.IA</span>
        <button class="close-btn" id="close"><i class="fa-solid fa-xmark"></i> Fechar leitura</button>
      </div>
      <article id="article"></article>
    </div>
  </div>

<script>
  const $=id=>document.getElementById(id);
  const state={all:[],filtered:[],topic:'',search:'',speech:null,speechButton:null};
  const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const arr=value=>Array.isArray(value)?value:[];
  const topicName=value=>value?String(value).replaceAll('_',' ').replace(/^./,c=>c.toUpperCase()):'Geral';

  function cleanText(value){
    if(value===null||value===undefined)return '';
    if(Array.isArray(value))return value.map(cleanText).filter(Boolean).join('\n\n');
    if(typeof value==='object')return Object.values(value).map(cleanText).filter(Boolean).join('\n\n');
    return String(value).replace(/\\r\\n/g,'\n').replace(/\\n/g,'\n').trim();
  }

  function parseLegacyDict(raw){
    if(typeof raw!=='string'||!raw.trim().startsWith('{'))return null;
    try{return JSON.parse(raw)}catch(_){/* legado Python */}
    const result={};
    const pattern=/'([^']+)'\s*:\s*'((?:\\.|[^'])*)'/g;
    let match;
    while((match=pattern.exec(raw))!==null){
      result[match[1]]=match[2].replace(/\\n/g,'\n').replace(/\\'/g,"'").replace(/\\"/g,'"');
    }
    return Object.keys(result).length?result:null;
  }

  function normalizedKey(key){
    return String(key||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  }

  function normalizeEasyBlocks(value){
    const blocks={o_principal:'',o_que_o_artigo_fez:'',o_que_foi_encontrado:'',o_que_ainda_nao_sabemos:''};
    let source=value;
    if(typeof source==='string')source=parseLegacyDict(source)||source;
    const aliases={
      o_principal:'o_principal',principal:'o_principal',mensagem_principal:'o_principal',
      o_que_o_artigo_fez:'o_que_o_artigo_fez',o_que_foi_feito:'o_que_o_artigo_fez',metodo:'o_que_o_artigo_fez',
      o_que_foi_encontrado:'o_que_foi_encontrado',resultados:'o_que_foi_encontrado',resultado:'o_que_foi_encontrado',
      o_que_ainda_nao_sabemos:'o_que_ainda_nao_sabemos',limitacoes:'o_que_ainda_nao_sabemos',incertezas:'o_que_ainda_nao_sabemos',limites:'o_que_ainda_nao_sabemos'
    };
    if(source&&typeof source==='object'&&!Array.isArray(source)){
      const extras=[];
      Object.entries(source).forEach(([key,val])=>{
        const target=aliases[normalizedKey(key)];
        const content=cleanText(val);
        if(target&&content)blocks[target]=content;else if(content)extras.push(content);
      });
      if(extras.length)blocks.o_principal=[blocks.o_principal,...extras].filter(Boolean).join('\n\n');
      return blocks;
    }
    const text=cleanText(source);
    if(!text)return blocks;
    const heading=/^(O principal|O que o artigo fez|O que foi encontrado|O que ainda não sabemos)\s*[:\-]?\s*$/gim;
    const matches=[...text.matchAll(heading)];
    if(matches.length){
      matches.forEach((match,index)=>{
        const start=match.index+match[0].length;
        const end=index+1<matches.length?matches[index+1].index:text.length;
        const target=aliases[normalizedKey(match[1])];
        if(target)blocks[target]=text.slice(start,end).trim();
      });
    }else blocks.o_principal=text;
    return blocks;
  }

  const n1=n=>cleanText(n.divulgacao_cientifica||n.leve||'');
  const n2Blocks=n=>normalizeEasyBlocks(n.leitura_facilitada_blocos||n.leitura_facilitada||n.forte||'');
  const source=n=>cleanText(n.resumo_cientifico_traduzido||n.texto_fonte_pt||n.abstract_pt||'');
  const status=n=>n.status_fidelidade_intelectual||n.status_fidelidade||'Revisão humana registrada';
  const priority=n=>n.score_prioridade_editorial??n.score_qualidade??'N/D';

  function paragraphsHTML(value){
    const text=cleanText(value);
    if(!text)return '<p>Texto não disponível.</p>';
    return text.split(/\n\s*\n/).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('');
  }

  function easyHTML(blocks){
    const order=[
      ['o_principal','O principal'],
      ['o_que_o_artigo_fez','O que o artigo fez'],
      ['o_que_foi_encontrado','O que foi encontrado'],
      ['o_que_ainda_nao_sabemos','O que ainda não sabemos']
    ];
    const items=order.filter(([key])=>cleanText(blocks[key]));
    if(!items.length)return '<div class="easy-empty">A leitura facilitada ainda não foi preparada.</div>';
    return `<div class="easy-list">${items.map(([key,label],index)=>`<section class="easy-block"><div class="easy-heading"><span class="easy-number">${index+1}</span><h3>${esc(label)}</h3></div><p>${esc(cleanText(blocks[key])).replace(/\n/g,'<br>')}</p></section>`).join('')}</div>`;
  }

  $('today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  async function init(){
    try{
      const response=await fetch('noticias.json',{cache:'no-store'});
      if(!response.ok)throw new Error('Não foi possível abrir noticias.json');
      state.all=await response.json();
    }catch(error){console.error(error);state.all=[]}
    buildTopics();applyFilters();
  }

  function buildTopics(){
    const box=$('topics');
    [...new Set(state.all.map(n=>n.tema).filter(Boolean))].sort().forEach(value=>{
      const button=document.createElement('button');
      button.className='topic';button.dataset.topic=value;button.textContent=topicName(value);box.appendChild(button);
    });
    box.addEventListener('click',event=>{
      const button=event.target.closest('.topic');if(!button)return;
      document.querySelectorAll('.topic').forEach(x=>x.classList.remove('active'));
      button.classList.add('active');state.topic=button.dataset.topic||'';applyFilters();
    });
  }

  $('search').addEventListener('input',event=>{state.search=event.target.value.toLowerCase().trim();applyFilters()});

  function applyFilters(){
    state.filtered=state.all.filter(n=>{
      const topicOk=!state.topic||n.tema===state.topic;
      const blocks=n2Blocks(n);
      const hay=[n.manchete,n.subtitulo,n.titulo_pt,n.titulo_original,n.autores,n.tema,n1(n),source(n),...Object.values(blocks)].join(' ').toLowerCase();
      return topicOk&&(!state.search||hay.includes(state.search));
    });
    render();
  }

  function meta(n){
    const design=n.desenho_estudo_rotulo||arr(n.tipos)[0]||'Tipo não informado';
    return `<div class="meta"><span><i class="fa-solid fa-user-pen"></i> ${esc(n.autores||'Autores não informados')}</span><span><i class="fa-regular fa-calendar"></i> ${esc(n.ano||'Ano não informado')}</span><span><i class="fa-solid fa-book-open"></i> ${esc(design)}</span></div>`;
  }

  function render(){
    const main=$('main');
    if(!state.filtered.length){main.innerHTML='<div class="empty"><h2>Nenhuma matéria publicada</h2><p>Publique uma matéria no painel editorial para exibi-la aqui.</p></div>';return}
    const [featured,...rest]=state.filtered;
    const preview=n1(featured).slice(0,360);
    let html=`<section class="intro"><article class="featured" data-open="${esc(featured.paper_id)}" tabindex="0"><span class="eyebrow"><i class="fa-solid fa-star"></i> Em destaque</span><h1>${esc(featured.manchete||featured.titulo_pt||featured.titulo_original)}</h1>${featured.subtitulo?`<p class="subtitle">${esc(featured.subtitulo)}</p>`:''}<p class="preview">${esc(preview)}${n1(featured).length>360?'…':''}</p>${meta(featured)}</article><aside class="reading-guide"><h2>Três formas de ler</h2><p>O conteúdo parte da mesma fonte científica e muda apenas o nível de explicação.</p><div class="guide-item"><span class="guide-number">1</span><div><strong>Divulgação científica</strong><small>Notícia explicada para o público geral.</small></div></div><div class="guide-item"><span class="guide-number">2</span><div><strong>Leitura facilitada</strong><small>Quatro blocos, frases diretas e menor esforço de inferência.</small></div></div><div class="guide-item"><span class="guide-number">3</span><div><strong>Resumo científico</strong><small>Tradução técnica fiel ao resumo original.</small></div></div></aside></section>`;
    if(rest.length){
      html+=`<div class="section-head"><h2>Outras matérias</h2><span>${rest.length} publicação(ões)</span></div><section class="grid">`;
      rest.forEach(n=>{html+=`<article class="news-card" data-open="${esc(n.paper_id)}" tabindex="0"><div class="chips"><span class="chip blue">${esc(n.desenho_estudo_rotulo||arr(n.tipos)[0]||'Artigo')}</span><span class="chip">${esc(topicName(n.tema))}</span>${n.revisao_humana_confirmada?'<span class="chip green">Revisado</span>':''}</div><h3>${esc(n.manchete||n.titulo_pt||n.titulo_original)}</h3><p>${esc(n1(n))}</p><div class="news-card-footer"><span>${esc(n.ano||'')}</span><span>${esc(status(n))}</span></div></article>`});
      html+='</section>';
    }
    main.innerHTML=html;
    main.querySelectorAll('[data-open]').forEach(el=>{el.addEventListener('click',()=>openArticle(el.dataset.open));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openArticle(el.dataset.open)}})});
  }

  function metric(label,value){return `<div class="metric"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`}

  function openArticle(id){
    const n=state.all.find(item=>String(item.paper_id)===String(id));if(!n)return;
    stopSpeech();
    const evaluation=n.avaliacao_fidelidade_intelectual||{};
    const fidelity=n.fidelidade_intelectual;
    const s1=n.metricas_estruturais_n1?.indice_experimental??n.isr_leve??'N/D';
    const s2=n.metricas_estruturais_n2?.indice_experimental??n.isr_forte??'N/D';
    const terms=n.termos_complexos||n.jargoes_chave||[];
    const blocks=n2Blocks(n);
    const links=[
      n.url_artigo?`<a href="${esc(n.url_artigo)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Registro científico</a>`:'',
      n.url_texto_completo?`<a class="green" href="${esc(n.url_texto_completo)}" target="_blank" rel="noopener"><i class="fa-solid fa-book-open"></i> Texto completo</a>`:'',
      n.url_pdf?`<a class="green" href="${esc(n.url_pdf)}" target="_blank" rel="noopener"><i class="fa-solid fa-file-pdf"></i> Acessar documento</a>`:''
    ].join('');

    $('article').innerHTML=`<section class="article-header"><div class="chips"><span class="chip blue">${esc(n.desenho_estudo_rotulo||arr(n.tipos)[0]||'Artigo científico')}</span><span class="chip">${esc(topicName(n.tema))}</span>${n.revisao_humana_confirmada?'<span class="chip green">Revisão humana registrada</span>':''}</div><h1 id="articleTitle">${esc(n.manchete||n.titulo_pt||n.titulo_original)}</h1>${n.subtitulo?`<p class="subtitle">${esc(n.subtitulo)}</p>`:''}${meta(n)}</section><div class="article-body"><nav class="tabs" aria-label="Níveis de leitura"><button class="tab active" data-tab="n1">Divulgação científica</button><button class="tab" data-tab="n2">Leitura facilitada</button><button class="tab" data-tab="source">Resumo científico</button></nav><section id="panel-n1" class="panel active"><div class="reading-shell"><div class="reading n1" id="text-n1">${paragraphsHTML(n1(n))}</div><button class="audio" data-speak="text-n1"><i class="fa-solid fa-volume-high"></i> Ouvir notícia</button></div></section><section id="panel-n2" class="panel"><div class="reading-shell"><div class="format-note"><i class="fa-solid fa-universal-access"></i><span>Esta versão usa blocos curtos e linguagem direta, mas mantém números, limitações e incertezas importantes.</span></div><div id="text-n2">${easyHTML(blocks)}</div><button class="audio" data-speak="text-n2"><i class="fa-solid fa-volume-high"></i> Ouvir leitura facilitada</button></div></section><section id="panel-source" class="panel"><div class="reading-shell"><div class="format-note"><i class="fa-solid fa-language"></i><span>Tradução técnica do resumo científico. Esta versão preserva o nível de detalhe e não é uma recomendação médica.</span></div><div class="reading source" id="text-source">${paragraphsHTML(source(n))}</div><button class="audio" data-speak="text-source"><i class="fa-solid fa-volume-high"></i> Ouvir resumo</button></div></section><section class="publication-info"><h2>Sobre esta publicação</h2><div class="metrics">${metric('Fidelidade intelectual',typeof fidelity==='number'?fidelity.toFixed(1):status(n))}${metric('Prioridade editorial',priority(n))}${metric('Ganho estrutural N1',typeof s1==='number'?s1.toFixed(1)+'%':s1)}${metric('Ganho estrutural N2',typeof s2==='number'?s2.toFixed(1)+'%':s2)}</div><p class="notice">As métricas automáticas apoiam a revisão editorial e não substituem a conferência humana da fonte.</p></section><details><summary>Detalhes técnicos</summary><p><strong>Status:</strong> ${esc(status(n))}</p><p><strong>Alinhamento temático sentencial N1:</strong> ${esc(evaluation.similaridade_tematica_n1??n.sim_origem_leve??'N/D')}</p><p><strong>Cobertura temática auxiliar N1:</strong> ${esc(evaluation.cobertura_tematica_n1??n.cobertura_tematica_n1??'N/D')}</p><p><strong>Alinhamento temático sentencial N2:</strong> ${esc(evaluation.similaridade_tematica_n2??n.sim_origem_forte??'N/D')}</p><p><strong>Cobertura temática auxiliar N2:</strong> ${esc(evaluation.cobertura_tematica_n2??n.cobertura_tematica_n2??'N/D')}</p><p><strong>Termos complexos detectados automaticamente:</strong> ${terms.length?terms.map(esc).join(', '):'Nenhum termo registrado.'}</p><p class="notice">MiniLM é usado apenas como apoio de alinhamento por sentenças e recuperação de trechos candidatos. A fidelidade intelectual também considera sustentação, cobertura e preservação da incerteza, com revisão humana obrigatória. Prioridade editorial não equivale automaticamente a nível de evidência.</p></details><div class="source-links">${links}</div></div>`;

    $('overlay').classList.add('open');document.body.style.overflow='hidden';
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>switchTab(button.dataset.tab,button)));
    document.querySelectorAll('[data-speak]').forEach(button=>button.addEventListener('click',()=>toggleSpeech(button.dataset.speak,button)));
    $('close').focus();
  }

  function switchTab(name,button){
    stopSpeech();document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));button.classList.add('active');$('panel-'+name).classList.add('active');
  }

  function toggleSpeech(elementId,button){
    if(!('speechSynthesis' in window))return;
    if(state.speechButton===button){stopSpeech();return}
    stopSpeech();const content=$(elementId)?.textContent?.trim();if(!content)return;
    const utterance=new SpeechSynthesisUtterance(content);utterance.lang='pt-BR';utterance.rate=.93;state.speech=utterance;state.speechButton=button;button.classList.add('playing');button.innerHTML='<i class="fa-solid fa-square"></i> Parar áudio';utterance.onend=utterance.onerror=stopSpeech;window.speechSynthesis.speak(utterance);
  }

  function stopSpeech(){window.speechSynthesis?.cancel();if(state.speechButton){state.speechButton.classList.remove('playing');state.speechButton.innerHTML='<i class="fa-solid fa-volume-high"></i> Ouvir texto'}state.speech=null;state.speechButton=null}
  function closeReader(){stopSpeech();$('overlay').classList.remove('open');document.body.style.overflow=''}
  $('close').addEventListener('click',closeReader);
  $('overlay').addEventListener('click',event=>{if(event.target===$('overlay'))closeReader()});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeReader()});
  init();
</script>
</body>
</html>
