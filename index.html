<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jornal Cienc.IA — divulgação científica em saúde com diferentes níveis de leitura.">
  <title>Jornal Cienc.IA — Ciência em saúde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo</a>

  <header class="site-header">
    <div class="header-top">
      <a class="brand" href="index.html" aria-label="Página inicial do Jornal Cienc.IA">
        <span class="brand-mark" aria-hidden="true"><i class="fa-solid fa-flask"></i></span>
        <span class="brand-copy">
          <span class="brand-name">Jornal Cienc<span class="ia">.IA</span></span>
          <span class="brand-tagline">As melhores pesquisas da saúde em linguagem acessível</span>
        </span>
      </a>

      <div class="header-tools">
        <label class="search" aria-label="Buscar notícias">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="campo-busca" type="search" placeholder="Buscar por assunto ou título" autocomplete="off">
        </label>
        <span class="header-date" id="data-hoje" aria-live="polite"></span>
      </div>
    </div>
  </header>

  <main class="page" id="conteudo-principal">
    <div class="content-layout">
      <aside class="topics-sidebar" id="painel-temas" aria-label="Explorar por temas e perguntas">
        <div class="sidebar-top">
          <span class="topics-kicker">Explorar</span>
          <button class="topics-toggle" id="alternar-temas" type="button"
                  aria-expanded="false" aria-controls="listas-exploracao">
            <span id="rotulo-alternar-exploracao">Ver opções</span>
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div id="listas-exploracao">
          <section class="sidebar-section" aria-labelledby="titulo-temas">
            <h2 id="titulo-temas"><i class="fa-solid fa-layer-group" aria-hidden="true"></i> Temas</h2>
            <nav class="topic-list" id="lista-temas" aria-label="Selecionar tema"></nav>
          </section>
          <section class="sidebar-section sidebar-section-questions" aria-labelledby="titulo-perguntas">
            <h2 id="titulo-perguntas"><i class="fa-regular fa-circle-question" aria-hidden="true"></i> Perguntas</h2>
            <nav class="topic-list" id="lista-perguntas" aria-label="Selecionar pergunta"></nav>
          </section>
        </div>
      </aside>

      <div class="news-content">
        <div id="portal-noticias" aria-live="polite">
          <div class="empty-state">
            <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
            <h2>Carregando notícias</h2>
            <p>Aguarde um instante.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span><span class="footer-brand">Jornal Cienc.IA</span> · Divulgação científica em saúde.</span>
      <span>Conteúdo baseado em artigos científicos.</span>
    </div>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
